[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


# ── Project metadata (PEP 621) ────────────────────────────────────────────────

[project]
name = "multiple-integrate"
version = "2.2.0"
description = "Symbolic definite integration with geometric reductions, coordinate transformations, and convergence analysis."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"

authors = [{name = "Bhuvanesh Bhatt", email = "bhuvaneshbhatt@gmail.com"}]

keywords = [
    "symbolic mathematics",
    "symbolic computation",
    "integration",
    "definite integration",
    "multiple integrals",
    "multivariate integrals",
    "calculus",
    "sympy",
    "computer algebra",
    "layer-cake formula",
    "co-area formula"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "semialg>=1.3.2",
    "funcprops>=0.3.0",
]


# ── Optional dependency groups ────────────────────────────────────────────────

[project.optional-dependencies]
asymptotic = ["asymptotic>=0.2.1"]
test = [
    "pytest>=8",
    "hypothesis>=6",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.4",
    "mypy>=1.10",
]
release = [
    "build>=1.2",
    "twine>=6",
]
notebook-test = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6",
]
notebook = [
    "jupyter>=1.0",
    "notebook>=7.0",
    "ipykernel>=6.0",
    "matplotlib>=3.7",
]
docs = [
    "sphinx>=8,<9",
    "sphinx-rtd-theme>=3,<4",
    "myst-parser>=4,<5",
]
all = [
    "asymptotic>=0.2.1",
    "funcprops>=0.3.0",
    "semialg>=1.3.2",
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.4",
    "mypy>=1.10",
    "jupyter>=1.0",
    "notebook>=7.0",
    "ipykernel>=6.0",
    "matplotlib>=3.7",
    "sphinx>=8,<9",
    "sphinx-rtd-theme>=3,<4",
    "myst-parser>=4,<5",
]


# ── Project URLs ──────────────────────────────────────────────────────────────

[project.urls]
"Homepage"      = "https://github.com/BhuvaneshBhatt/multiple_integrate"
"Documentation" = "https://multiple-integrate.readthedocs.io/"
"Source"        = "https://github.com/BhuvaneshBhatt/multiple_integrate"
"Issue Tracker" = "https://github.com/BhuvaneshBhatt/multiple_integrate/issues"
"Changelog"     = "https://github.com/BhuvaneshBhatt/multiple_integrate/blob/main/CHANGELOG.md"


# ── setuptools build ──────────────────────────────────────────────────────────

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["multiple_integrate*"]


# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')"
]


# ── ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
src            = ["src"]
line-length    = 100
target-version = "py311"
exclude        = [".git", ".venv", ".pytest_cache", ".ruff_cache", "build", "docs", "dist", "notebooks", "README.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["multiple_integrate"]

[tool.ruff.lint.per-file-ignores]
# Retain the public str(status) behavior; StrEnum would change it.
"src/multiple_integrate/results.py" = ["UP042"]

# ── mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
mypy_path              = "src"
packages               = ["multiple_integrate"]
python_version         = "3.11"
strict                 = false
warn_unused_configs    = true
warn_return_any        = false
ignore_missing_imports = true
