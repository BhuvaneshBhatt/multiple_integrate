name: Geometry examples, notebooks and documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  examples-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,docs,notebook-test]'
      - run: python tools/sync_geometry_examples.py --check
      - run: python examples/geometry_casebook.py
      - run: MI_DOCS_OFFLINE=1 python -m sphinx -W -b html docs /tmp/mi-docs
      - run: python tools/run_notebook.py --section geometry --output /tmp/geometry-demo.ipynb --cell-timeout 60 --total-timeout 240
      - run: python tools/run_notebook.py --section supported --output /tmp/supported-demo.ipynb --cell-timeout 60 --total-timeout 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-geometry-notebooks
          path: |
            /tmp/*-demo.ipynb
            /tmp/*-demo.execution.json
  online-links:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[docs]'
      - run: python -m sphinx -W -b linkcheck docs /tmp/mi-linkcheck
