name: sibling integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sibling-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out MultipleIntegrate
        uses: actions/checkout@v4
        with:
          path: multiple_integrate

      - name: Check out semialg
        uses: actions/checkout@v4
        with:
          repository: BhuvaneshBhatt/semialg
          path: semialg

      - name: Check out funcprops
        uses: actions/checkout@v4
        with:
          repository: BhuvaneshBhatt/funcprops
          path: funcprops

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            multiple_integrate/pyproject.toml
            semialg/pyproject.toml
            funcprops/pyproject.toml

      - name: Install sibling packages and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./semialg -e ./funcprops -e './multiple_integrate[test]'

      - name: Verify installed sibling sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import funcprops, semialg
          roots = {Path(funcprops.__file__).resolve(), Path(semialg.__file__).resolve()}
          assert any("funcprops" in str(path) for path in roots)
          assert any("semialg" in str(path) for path in roots)
          PY

      - name: Run cross-package contract tests
        working-directory: multiple_integrate
        run: python -m pytest tests/test_backend_delegation.py tests/test_semialgebraic_domains.py tests/test_intrinsic_semialgebraic.py tests/test_singularity_splitting.py
