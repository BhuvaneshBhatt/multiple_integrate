name: Semialg and installed wheel gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  wheel-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        semialg: [minimum, latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel and selected dependency
        run: |
          python -m pip install pytest hypothesis nbclient nbformat ipykernel dist/*.whl
          if [ '${{ matrix.semialg }}' = minimum ]; then
            python -m pip install semialg==1.3.0
          else
            python -m pip install --upgrade semialg
          fi
          python -m pip check
      - name: Run installed wheel suite
        run: |
          mkdir -p /tmp/mi-wheel-tests
          cp -R tests docs tools examples notebooks src .github README.md pyproject.toml /tmp/mi-wheel-tests/
          cd /tmp/mi-wheel-tests
          python -m pytest --junitxml=results.xml

      - name: Run installed-wheel casebook and clean-kernel notebook
        run: |
          cd /tmp/mi-wheel-tests
          python examples/geometry_casebook.py
          python tools/run_notebook.py --section geometry --output /tmp/wheel-geometry-demo.ipynb --cell-timeout 60 --total-timeout 240
